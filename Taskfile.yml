---
version: '3'
env:
  install_vim_shell_packages: false
  brew_install: false
  git_clone: false
tasks:
  clear:
    internal: true
    cmds: [clear]
  galaxy:
    internal: true
    cmds:
      - ansible-galaxy install -r requirements.yml
  playbook:
    internal: true
    vars:
      playbook: '{{ .playbook | default "playbook.yml" }}'
      location: '{{ .location }}'
    deps:
      - clear
      - galaxy
    cmds:
      - |
        ansible-playbook \
          -i localhost, -c local \
          {{ .playbook | quote }} \
          -e '{install_vim_shell_packages: {{ .install_vim_shell_packages }}}' \
          -e '{brew_install: {{ .brew_install }}}' \
          -e '{git_clone: {{ .git_clone }}}'
  playbook_remote:
    internal: true
    vars:
      playbook: '{{ .playbook | default "playbook.yml" }}'
    deps:
      - clear
      - galaxy
    cmds:
      - |
        ansible-playbook \
          {{ .playbook | quote }} \
          --limit dotfiles \
          -e '{install_vim_shell_packages: {{ .install_vim_shell_packages }}}' \
          -e '{brew_install: {{ .brew_install }}}' \
          -e '{git_clone: {{ .git_clone }}}'
  sudoer:
    cmds:
      - |
        ansible-playbook \
          -i localhost, -c local \
          --ask-become-pass \
          ./pb-sudoer.yml
  default:
    cmds:
      - task: playbook
        vars:
          brew_install: true
          git_clone: true
          install_vim_shell_packages: true
  bare_bones:
    aliases: [bb]
    cmds:
      - task: playbook
  install_vim_shell_packages:
    cmds:
      - task: playbook
        vars:
          install_vim_shell_packages: true
  brew_check:
    cmds:
      - brew bundle check --verbose
  brew_trust:
    desc: Trust the third-party taps declared in a Brewfile (defaults to Brewfile)
    vars:
      brewfile: '{{ .brewfile | default "Brewfile" }}'
    cmds:
      # brew refuses to write its trust store when the dir is group/world writable
      # (coder pods can boot with a permissive umask, making ~/.homebrew 0777)
      - mkdir -p ~/.homebrew && chmod go-w ~/.homebrew
      # taps come from the Brewfile itself so this never drifts from the bundle
      - |
        sed -nE 's/^tap "([^"]+)".*/\1/p' {{ .brewfile | quote }} | while read -r tap; do
          brew trust "$tap" || echo "warning: could not trust $tap (continuing)" >&2
        done
  brew_install:
    cmds:
      - task: brew_trust
        vars: {brewfile: Brewfile}
      - brew bundle install --verbose
  linux_brew_check:
    aliases: [lbc]
    cmds:
      - brew bundle check --verbose --file Brewfile.linux
  linux_brew_install:
    aliases: [lbi]
    cmds:
      - task: brew_trust
        vars: {brewfile: Brewfile.linux}
      - brew bundle install --verbose --file Brewfile.linux
  git:
    cmds:
      - task: playbook
        vars:
          git_clone: true
  remote:
    cmds:
      - task: playbook_remote
  init_local_variables:
    aliases: [ilv]
    desc: Copy variables.yml to variables.local.yml (skips if already exists)
    cmds:
      - |
        if [ -f variables.local.yml ]; then
          echo "variables.local.yml already exists, skipping"
        else
          cp variables.yml variables.local.yml
          echo "created variables.local.yml"
        fi
  lua_link:
    cmds:
      - ln -s ~/.local/share/nvim/site/pack/packer/start ./dots/config/nvim/lua/packer_plugins
      - ln -s ~/.local/share/nvim/lazy ./dots/config/nvim/lua/lazy_plugins
