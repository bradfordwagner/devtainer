# GlazeWM configuration - https://github.com/glzr-io/glazewm
#
# Source of truth lives here; `tasks/windows-wsl.yml` copies it to
# %USERPROFILE%\.glzr\glazewm\config.yaml on WSL hosts (it must be a copy, not a
# symlink -- Windows can't follow a WSL symlink living on /mnt/c).
# Re-run `task bb` after editing, then reload from the GlazeWM tray icon
# (or alt+shift+r).
#
# Local deltas from the upstream sample config:
#   - 4px gaps, except the top outer gap (32px = Zebar's 28px bar + the same 4px)
#   - Catppuccin Mocha window borders, matching the Zebar bar and ghostty
#   - alt+enter launches Windows Terminal (upstream launches cmd)

general:
  # Commands to run when the WM has started. This is useful for running a
  # script or launching another application.
  # Example: The below command launches Zebar.
  startup_commands: ['shell-exec zebar']

  # Commands to run just before the WM is shutdown.
  # Example: The below command kills Zebar.
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']

  # Commands to run after the WM config is reloaded.
  config_reload_commands: []

  # Whether to automatically focus windows underneath the cursor.
  focus_follows_cursor: false

  # Whether to switch back and forth between the previously focused
  # workspace when focusing the current workspace.
  toggle_workspace_on_refocus: false

  cursor_jump:
    # Whether to automatically move the cursor on the specified trigger.
    enabled: true

    # Trigger for cursor jump:
    # - 'monitor_focus': Jump when focus changes between monitors.
    # - 'window_focus': Jump when focus changes between windows.
    trigger: 'monitor_focus'

  # How windows should be hidden when switching workspaces.
  # - 'cloak': (Windows-only) Recommended option for Windows.
  # - 'hide': (Windows-only) Legacy option for Windows. Has stability issues with some apps.
  # - 'place_in_corner': Artifically hides the window by placing it in the corner of the
  #   monitor. On macOS, this is always used instead of cloak/hide.
  hide_method: 'cloak'

  # Affects which windows get shown in the native Windows taskbar. Has no
  # effect if `hide_method: 'hide'`.
  # - 'true': Show all windows (regardless of workspace).
  # - 'false': Only show windows from the currently shown workspaces.
  show_all_in_taskbar: false

gaps:
  # Whether to scale the gaps with the DPI of the monitor.
  scale_with_dpi: true

  # Gap between adjacent windows.
  inner_gap: '4px'

  # Gap between windows and the screen edge.
  outer_gap:
    # top = Zebar bar height + the 4px gap, so the space under the bar visually
    # matches every other gap. The bar is 28px: the `with-glazewm` widget's
    # `default` preset in zpack.json sets `height: '28px'` (upstream ships a 40px
    # bar and 60px of slack here, which reads as an oversized top margin).
    # Re-derive this if you resize the bar or switch widget packs.
    top: '32px'
    right: '4px'
    bottom: '4px'
    left: '4px'

window_effects:
  # Visual effects to apply to the focused window.
  focused_window:
    # Highlight the window with a colored border.
    # ** Exclusive to Windows 11 due to API limitations.
    border:
      enabled: true
      # catppuccin mocha mauve
      color: '#cba6f7'

    # Remove the title bar from the window's frame. Note that this can
    # cause rendering issues for some applications.
    hide_title_bar:
      enabled: false

    # Change the corner style of the window's frame.
    # ** Exclusive to Windows 11 due to API limitations.
    corner_style:
      enabled: false
      # Allowed values: 'square', 'rounded', 'small_rounded'.
      style: 'square'

    # Change the transparency of the window.
    transparency:
      enabled: false
      # Can be something like '95%' or '0.95' for slightly transparent windows.
      # '0' or '0%' is fully transparent (and, by consequence, unfocusable).
      opacity: '95%'

  # Visual effects to apply to non-focused windows.
  other_windows:
    border:
      enabled: true
      # catppuccin mocha surface0
      color: '#313244'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '0%'

window_behavior:
  # New windows are created in this state whenever possible.
  # Allowed values: 'tiling', 'floating'.
  initial_state: 'tiling'

  # Sets the default options for when a new window is created. This also
  # changes the defaults for when the state change commands, like
  # `set-floating`, are used without any flags.
  state_defaults:
    floating:
      # Whether to center floating windows by default.
      centered: true

      # Whether to show floating windows as always on top.
      shown_on_top: false

    fullscreen:
      # Maximize the window if possible. If the window doesn't have a
      # maximize button, then it'll be fullscreen'ed normally instead.
      maximized: false

      # Whether to show fullscreen windows as always on top.
      shown_on_top: false

workspaces:
  # qwert row
  - name: 'q'
  - name: 'w'
  - name: 'e'
  - name: 'r'
  - name: 't'

  # asdfg row
  - name: 'a'
  - name: 's'
  - name: 'd'
  - name: 'f'
  - name: 'g'

  # zxcvb row
  - name: 'z'
  - name: 'x'
  - name: 'c'
  - name: 'v'
  - name: 'b'

window_rules:
  - commands: ['ignore']
    match:
      # Ignores any Zebar windows.
      - window_process: { equals: 'zebar' }

      # Ignores picture-in-picture windows for browsers.
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

      # Ignore rules for various 3rd-party apps.
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }
      - window_process: { equals: 'CleanShot X' }

binding_modes:
  # When enabled, the focused window can be resized via arrow keys or HJKL.
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      # Press escape/enter/alt+' to return to default keybindings.
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter', 'alt+oem_quotes']

  # WM-meta commands live here rather than on alt+shift+<letter>, since every
  # letter in the qwert/asdfg/zxcvb block is now a workspace. Mirrors the
  # aerospace `service` mode (alt-shift-semicolon), including esc = reload.
  - name: 'service'
    keybindings:
      - commands: ['wm-reload-config', 'wm-disable-binding-mode --name service']
        bindings: ['escape']
      - commands: ['wm-redraw', 'wm-disable-binding-mode --name service']
        bindings: ['r']
      - commands: ['close', 'wm-disable-binding-mode --name service']
        bindings: ['x']
      - commands: ['wm-toggle-pause', 'wm-disable-binding-mode --name service']
        bindings: ['p']
      - commands: ['wm-exit']
        bindings: ['q']
      - commands: ['move-workspace --direction left', 'wm-disable-binding-mode --name service']
        bindings: ['h']
      - commands: ['move-workspace --direction down', 'wm-disable-binding-mode --name service']
        bindings: ['j']
      - commands: ['move-workspace --direction up', 'wm-disable-binding-mode --name service']
        bindings: ['k']
      - commands: ['move-workspace --direction right', 'wm-disable-binding-mode --name service']
        bindings: ['l']
      - commands: ['wm-disable-binding-mode --name service']
        bindings: ['enter', 'alt+shift+oem_quotes']

keybindings:
  # Shift focus in a given direction.
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']
  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']
  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']

  # Move focused window in a given direction.
  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k', 'alt+shift+up']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j', 'alt+shift+down']

  # Resize focused window by a percentage or pixel amount.
  - commands: ['resize --width -2%']
    bindings: ['alt+u']
  - commands: ['resize --width +2%']
    bindings: ['alt+p']
  - commands: ['resize --height +2%']
    bindings: ['alt+o']
  - commands: ['resize --height -2%']
    bindings: ['alt+i']

  # As an alternative to the resize keybindings above, resize mode enables
  # resizing via arrow keys or HJKL. The binding mode is defined above with
  # the name 'resize'. On the quote key, not aerospace's semicolon: tmux binds
  # M-; to `resize-pane -Z` and GlazeWM's hook would swallow it globally.
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+oem_quotes']

  # Service mode holds the WM-meta commands (exit/reload/redraw/pause/close)
  # that lost their alt+shift+<letter> keys to workspaces.
  - commands: ['wm-enable-binding-mode --name service']
    bindings: ['alt+shift+oem_quotes']

  # Disables window management and all other keybindings until alt+shift+p
  # is pressed again.
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']

  # Change tiling direction. This determines where new tiling windows will
  # be inserted.
  # (alt+/ because alt+v is workspace V; aerospace uses alt-slash for `layout
  # tiles horizontal vertical`, the same "flip the axis" key.)
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+oem_question']

  # Change focus from tiling windows -> floating -> fullscreen.
  - commands: ['wm-cycle-focus']
    bindings: ['alt+space']

  # Change the focused window to be floating.
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']

  # Change the focused window to be tiling. The return trip for alt+shift+space
  # -- toggle-floating has no size flags, so floating and tiling are two keys.
  - commands: ['toggle-tiling']
    bindings: ['alt+oem_comma']

  # Change the focused window to be fullscreen.
  - commands: ['toggle-fullscreen']
    bindings: ['alt+oem_period']

  # Minimize focused window.
  - commands: ['toggle-minimized']
    bindings: ['alt+m']

  # Close focused window. alt+shift+q is workspace Q, so the old chord picks up
  # ctrl. Nothing in tmux's root table claims C-M-S-q. Also `x` in service mode.
  - commands: ['close']
    bindings: ['alt+ctrl+shift+q']

  # wm-exit, wm-reload-config and wm-redraw moved into the `service` binding
  # mode (alt+shift+;) -- alt+shift+e/r/w are workspaces E/R/W now.

  # Launch Windows Terminal in focus mode (-f hides the tab bar and title bar;
  # note -F is *fullscreen*, a different thing). WT honours its own
  # `defaultProfile` (Ubuntu/WSL here) rather than forcing a shell -- upstream
  # ships `shell-exec cmd`. Scoped to this binding on purpose: WT started any
  # other way stays normal; for focus mode everywhere set
  # `"launchMode": "focus"` in WT's own settings.json instead. `-f` combines
  # with `-M` for maximized focus; pin a profile with e.g. `-f -p Ubuntu`.
  - commands: ['shell-exec wt -f']
    bindings: ['alt+enter']

  # Focus the next/previous active workspace defined in `workspaces` config.
  # On the bracket keys because alt+a/alt+s are workspaces A/S now.
  - commands: ['focus --next-active-workspace']
    bindings: ['alt+oem_close_brackets']
  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+oem_open_brackets']

  # Focus the workspace that last had focus. (aerospace: alt-esc.)
  - commands: ['focus --recent-workspace']
    bindings: ['alt+escape']

  # Letter workspaces: the left-hand block, laid out as it sits on the keyboard.

  # qwert row
  - commands: ['focus --workspace q']
    bindings: ['alt+q']
  - commands: ['focus --workspace w']
    bindings: ['alt+w']
  - commands: ['focus --workspace e']
    bindings: ['alt+e']
  - commands: ['focus --workspace r']
    bindings: ['alt+r']
  - commands: ['focus --workspace t']
    bindings: ['alt+t']

  # asdfg row
  - commands: ['focus --workspace a']
    bindings: ['alt+a']
  - commands: ['focus --workspace s']
    bindings: ['alt+s']
  - commands: ['focus --workspace d']
    bindings: ['alt+d']
  - commands: ['focus --workspace f']
    bindings: ['alt+f']
  - commands: ['focus --workspace g']
    bindings: ['alt+g']

  # zxcvb row
  - commands: ['focus --workspace z']
    bindings: ['alt+z']
  - commands: ['focus --workspace x']
    bindings: ['alt+x']
  - commands: ['focus --workspace c']
    bindings: ['alt+c']
  - commands: ['focus --workspace v']
    bindings: ['alt+v']
  - commands: ['focus --workspace b']
    bindings: ['alt+b']


  # Move the focused window's parent workspace to a monitor in a given
  # direction: service mode h/j/k/l. It lost alt+shift+a/s/d/f to workspaces,
  # and alt+ctrl+hjkl is not available either -- tmux binds C-M-hjkl to
  # select-pane (dots/tmux/tmux.conf), and GlazeWM's keyboard hook would eat it
  # before Windows Terminal ever saw it. A multi-monitor move is rare enough to
  # live behind the mode leader.

  # Move focused window to a workspace defined in `workspaces` config.
  # Same grid as focus above.

  # qwert row
  - commands: ['move --workspace q', 'focus --workspace q']
    bindings: ['alt+shift+q']
  - commands: ['move --workspace w', 'focus --workspace w']
    bindings: ['alt+shift+w']
  - commands: ['move --workspace e', 'focus --workspace e']
    bindings: ['alt+shift+e']
  - commands: ['move --workspace r', 'focus --workspace r']
    bindings: ['alt+shift+r']
  - commands: ['move --workspace t', 'focus --workspace t']
    bindings: ['alt+shift+t']

  # asdfg row
  - commands: ['move --workspace a', 'focus --workspace a']
    bindings: ['alt+shift+a']
  - commands: ['move --workspace s', 'focus --workspace s']
    bindings: ['alt+shift+s']
  - commands: ['move --workspace d', 'focus --workspace d']
    bindings: ['alt+shift+d']
  - commands: ['move --workspace f', 'focus --workspace f']
    bindings: ['alt+shift+f']
  - commands: ['move --workspace g', 'focus --workspace g']
    bindings: ['alt+shift+g']

  # zxcvb row
  - commands: ['move --workspace z', 'focus --workspace z']
    bindings: ['alt+shift+z']
  - commands: ['move --workspace x', 'focus --workspace x']
    bindings: ['alt+shift+x']
  - commands: ['move --workspace c', 'focus --workspace c']
    bindings: ['alt+shift+c']
  - commands: ['move --workspace v', 'focus --workspace v']
    bindings: ['alt+shift+v']
  - commands: ['move --workspace b', 'focus --workspace b']
    bindings: ['alt+shift+b']

