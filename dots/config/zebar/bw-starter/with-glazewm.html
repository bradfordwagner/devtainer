<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Custom styles. -->
    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <!-- Allows React to be run buildless via "text/babel" script below. -->
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, {
        useState,
        useEffect,
        useRef,
      } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.0';

      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu' },
        date: { type: 'date', formatting: 'EEE d MMM t' },
        battery: { type: 'battery' },
        memory: { type: 'memory' },
        weather: { type: 'weather' },
      });

      createRoot(document.getElementById('root')).render(<App />);

      function App() {
        const [output, setOutput] = useState(providers.outputMap);

        useEffect(() => {
          providers.onOutput(() => setOutput(providers.outputMap));
        }, []);

        // Self-heal a wedged battery provider. Zebar acquires the OS battery
        // handle once and reuses it for the life of the provider
        // (glzr-io/zebar#262, in 3.3.0+); if that handle goes stale, every
        // refresh from then on errors, the provider group nulls out `battery`,
        // and the segment stays gone until zebar itself is restarted.
        // Restarting just this provider makes the desktop side drop the
        // instance and acquire a fresh handle. Gated on having seen a reading
        // at least once, so a machine with no battery is left alone rather
        // than restarted in a loop.
        const hasReported = useRef(false);

        useEffect(() => {
          const timer = setInterval(() => {
            if (providers.outputMap.battery) {
              hasReported.current = true;
            } else if (hasReported.current) {
              providers.raw.battery.restart();
            }
          }, 60000);

          return () => clearInterval(timer);
        }, []);

        // Render a used/total byte pair in whichever unit fits the total, so
        // both halves share one scale, e.g. "12.4/31.9 GiB". Base-1024, hence
        // the IEC unit names.
        function formatUsedTotal(used, total) {
          const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
          if (!total) return '-';
          const exp = Math.min(
            Math.floor(Math.log(total) / Math.log(1024)),
            units.length - 1,
          );
          const scale = 1024 ** exp;
          return `${(used / scale).toFixed(1)}/${(total / scale).toFixed(1)} ${units[exp]}`;
        }

        // The cpu provider reports a usage percentage rather than a used/total
        // pair, so express it as cores in use out of the logical core count,
        // e.g. "6.3/12 (52%)". Falls back to the bare percentage if the core
        // count is unavailable.
        function formatCpu(cpuOutput) {
          const pct = Math.round(cpuOutput.usage);
          const total = cpuOutput.logicalCoreCount;
          if (!total) return `${pct}%`;
          const used = ((cpuOutput.usage / 100) * total).toFixed(1);
          return `${used}/${total} (${pct}%)`;
        }

        // e.g. "21.6/31.6 GiB (68%)".
        function formatMemory(memoryOutput) {
          const pair = formatUsedTotal(
            memoryOutput.usedMemory,
            memoryOutput.totalMemory,
          );
          return `${pair} (${Math.round(memoryOutput.usage)}%)`;
        }

        // Battery time remaining as "7h 39m", or "39m" under the hour. The
        // provider reports timeTillEmpty/timeTillFull in milliseconds and
        // leaves both null when it has no estimate - typically at full charge,
        // or right after waking, before it has sampled a discharge rate.
        function formatDuration(ms) {
          if (!Number.isFinite(ms) || ms <= 0) return null;
          const totalMinutes = Math.round(ms / 60000);
          if (totalMinutes < 1) return null;
          const hours = Math.floor(totalMinutes / 60);
          const minutes = totalMinutes % 60;
          return hours ? `${hours}h ${minutes}m` : `${minutes}m`;
        }

        // Time till full while charging, time till empty while discharging.
        // Renders as a parenthesised suffix to the percentage, matching the
        // cpu/memory segments; collapses to nothing when there's no estimate.
        function formatBatteryTime(batteryOutput) {
          const remaining = formatDuration(
            batteryOutput.isCharging
              ? batteryOutput.timeTillFull
              : batteryOutput.timeTillEmpty,
          );
          return remaining ? ` (${remaining})` : '';
        }

        // Get icon to show for how much of the battery is charged.
        function getBatteryIcon(batteryOutput) {
          if (batteryOutput.chargePercent > 90)
            return <i className="nf nf-fa-battery_4"></i>;
          if (batteryOutput.chargePercent > 70)
            return <i className="nf nf-fa-battery_3"></i>;
          if (batteryOutput.chargePercent > 40)
            return <i className="nf nf-fa-battery_2"></i>;
          if (batteryOutput.chargePercent > 20)
            return <i className="nf nf-fa-battery_1"></i>;
          return <i className="nf nf-fa-battery_0"></i>;
        }

        // Get icon to show for current weather status.
        function getWeatherIcon(weatherOutput) {
          switch (weatherOutput.status) {
            case 'clear_day':
              return <i className="nf nf-weather-day_sunny"></i>;
            case 'clear_night':
              return <i className="nf nf-weather-night_clear"></i>;
            case 'cloudy_day':
              return <i className="nf nf-weather-day_cloudy"></i>;
            case 'cloudy_night':
              return <i className="nf nf-weather-night_alt_cloudy"></i>;
            case 'light_rain_day':
              return <i className="nf nf-weather-day_sprinkle"></i>;
            case 'light_rain_night':
              return <i className="nf nf-weather-night_alt_sprinkle"></i>;
            case 'heavy_rain_day':
              return <i className="nf nf-weather-day_rain"></i>;
            case 'heavy_rain_night':
              return <i className="nf nf-weather-night_alt_rain"></i>;
            case 'snow_day':
              return <i className="nf nf-weather-day_snow"></i>;
            case 'snow_night':
              return <i className="nf nf-weather-night_alt_snow"></i>;
            case 'thunder_day':
              return <i className="nf nf-weather-day_lightning"></i>;
            case 'thunder_night':
              return <i className="nf nf-weather-night_alt_lightning"></i>;
          }
        }

        return (
          <div className="app">
            <div className="left">
              {output.glazewm && (
                <div className="workspaces">
                  {output.glazewm.currentWorkspaces.map(workspace => (
                    <button
                      className={`workspace ${workspace.hasFocus && 'focused'} ${workspace.isDisplayed && 'displayed'}`}
                      onClick={() =>
                        output.glazewm.runCommand(
                          `focus --workspace ${workspace.name}`,
                        )
                      }
                      key={workspace.name}
                    >
                      {workspace.displayName ?? workspace.name}
                    </button>
                  ))}
                </div>
              )}
            </div>

            <div className="center">{output.date?.formatted}</div>

            <div className="right">
              {output.glazewm && (
                <>
                  {output.glazewm.isPaused && (
                    <button
                      className="paused-button"
                      onClick={() =>
                        output.glazewm.runCommand('wm-toggle-pause')
                      }
                    >
                      PAUSED
                    </button>
                  )}
                  {output.glazewm.bindingModes.map(bindingMode => (
                    <button
                      className="binding-mode"
                      key={bindingMode.name}
                      onClick={() =>
                        output.glazewm.runCommand(
                          `wm-disable-binding-mode --name ${bindingMode.name}`,
                        )
                      }
                    >
                      {bindingMode.displayName ?? bindingMode.name}
                    </button>
                  ))}

                  <button
                    className={`tiling-direction nf ${
                      output.glazewm.tilingDirection === 'horizontal'
                        ? 'nf-md-swap_horizontal'
                        : 'nf-md-swap_vertical'
                    }`}
                    onClick={() =>
                      output.glazewm.runCommand('toggle-tiling-direction')
                    }
                  ></button>
                </>
              )}

              {output.cpu && (
                <div className="cpu">
                  <i className="nf nf-oct-cpu"></i>

                  {/* Change the text color if the CPU usage is high. */}
                  <span
                    className={output.cpu.usage > 85 ? 'high-usage' : ''}
                  >
                    {formatCpu(output.cpu)}
                  </span>
                </div>
              )}

              {output.memory && (
                <div className="memory">
                  <i className="nf nf-fae-chip"></i>
                  {formatMemory(output.memory)}
                </div>
              )}

              {output.battery && (
                <div className="battery">
                  {/* Show icon for whether battery is charging. */}
                  {output.battery.isCharging && (
                    <i className="nf nf-md-power_plug charging-icon"></i>
                  )}
                  {getBatteryIcon(output.battery)}
                  {Math.round(output.battery.chargePercent)}%
                  {formatBatteryTime(output.battery)}
                </div>
              )}

              {output.weather && (
                <div className="weather">
                  {getWeatherIcon(output.weather)}
                  {Math.round(output.weather.fahrenheitTemp)}°F
                </div>
              )}
            </div>
          </div>
        );
      }
    </script>
  </body>
</html>
