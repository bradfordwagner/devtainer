---

# Homebrew persistence for hosts with an ephemeral / (e.g. Coder pods):
# keep the blessed prefix string /home/linuxbrew/.linuxbrew (so pre-built bottles
# are used) but back its storage with a symlink into the persistent home volume.
# Only the symlink lives on the throwaway layer, so re-creating it after a rebuild
# restores brew without reinstalling. See coder.md.
# Guard against a broken HOME: if ansible_env.HOME is empty/undefined, the paths
# below render as bare "/linuxbrew" and the force:true relink would repoint the
# blessed prefix at the filesystem root — poisoning brew (every `brew link` then
# fails with "Permission denied @ dir_s_mkdir - /linuxbrew"). Skip all brew
# symlink management in that case rather than risk it.
- name: linuxbrew - assert HOME is usable
  ansible.builtin.set_fact:
    linuxbrew_home_ok: "{{ ansible_env.HOME is defined and (ansible_env.HOME | default('') | length > 0) }}"

- name: linuxbrew - warn if HOME is unusable
  ansible.builtin.debug:
    msg: >-
      ansible_env.HOME is empty/undefined — skipping brew prefix symlink
      management to avoid pointing /home/linuxbrew/.linuxbrew at /linuxbrew.
  when: not linuxbrew_home_ok

- name: linuxbrew - ensure persistent store dir exists in home
  ansible.builtin.file:
    path: '{{ ansible_env.HOME }}/linuxbrew'
    state: directory
    mode: '0755'
  when: linuxbrew_home_ok

- name: linuxbrew - stat the blessed prefix
  ansible.builtin.stat:
    path: /home/linuxbrew/.linuxbrew
  register: linuxbrew_dest

# creating /home/linuxbrew + the symlink needs root. The normal playbook flow
# avoids root become, so probe for passwordless sudo and skip gracefully if we
# don't have it (mirrors the xfconf/argocd rc==0 gating below).
- name: linuxbrew - check for passwordless sudo
  ansible.builtin.command: sudo -n true
  register: linuxbrew_sudo
  failed_when: false
  changed_when: false

- name: linuxbrew - enforce prefix symlink onto persistent store
  become: true
  ansible.builtin.file:
    src: '{{ ansible_env.HOME }}/linuxbrew'
    dest: /home/linuxbrew/.linuxbrew
    state: link
    force: true
  # only when we can sudo AND the dest is safe to (re)link — i.e. absent or already
  # a symlink. Never clobber a real brew install (a real dir), e.g. on WSL.
  when:
    - linuxbrew_home_ok
    - linuxbrew_sudo.rc == 0
    - not linuxbrew_dest.stat.exists or linuxbrew_dest.stat.islnk

- name: linuxbrew - warn if symlink needed but no passwordless sudo
  ansible.builtin.debug:
    msg: >-
      /home/linuxbrew/.linuxbrew is missing and passwordless sudo is unavailable —
      skipping brew prefix symlink. Create it manually (see coder.md) or run once
      with sudo.
  when:
    - linuxbrew_sudo.rc != 0
    - not linuxbrew_dest.stat.exists

- block:
  - name: install fzf completions
    shell: $(brew --prefix)/opt/fzf/install --key-bindings --completion --no-update-rc

- name: xfce - check xfconf-query exists
  shell: command -v xfconf-query
  register: xfconf_query
  failed_when: false
  changed_when: false

- block:
  - name: xfce - remove Ctrl+Alt+F thunar binding (custom)
    shell: xfconf-query -c xfce4-keyboard-shortcuts -p '/commands/custom/<Primary><Alt>f' --reset
    failed_when: false

  - name: xfce - remove Ctrl+Alt+F thunar binding (default)
    shell: xfconf-query -c xfce4-keyboard-shortcuts -p '/commands/default/<Primary><Alt>f' --reset
    failed_when: false

  when: xfconf_query.rc == 0
