---
- name: ensure claude commands directory exists
  file:
    path: '{{ ansible_env.HOME }}/.claude/commands'
    state: directory
    mode: 0755

- name: find claude command files in repo
  find:
    paths: '{{ devtainer.dir }}/dots/config/claude/commands'
    patterns: '*.md'
  register: claude_command_files

- name: copy claude command files
  copy:
    src: '{{ item.path }}'
    dest: '{{ ansible_env.HOME }}/.claude/commands/{{ item.path | basename }}'
    mode: 0644
  loop: '{{ claude_command_files.files }}'
  when: claude_command_files.files | length > 0

- name: ensure claude agents directory exists
  file:
    path: '{{ ansible_env.HOME }}/.claude/agents'
    state: directory
    mode: 0755

- name: find claude agent files in repo
  find:
    paths: '{{ devtainer.dir }}/dots/config/claude/agents'
    patterns: '*.md'
  register: claude_agent_files

- name: copy claude agent files
  copy:
    src: '{{ item.path }}'
    dest: '{{ ansible_env.HOME }}/.claude/agents/{{ item.path | basename }}'
    mode: 0644
  loop: '{{ claude_agent_files.files }}'
  when: claude_agent_files.files | length > 0

- name: ensure claude scripts directory exists
  file:
    path: '{{ ansible_env.HOME }}/.claude/scripts'
    state: directory
    mode: 0755

# Tools the subagents invoke by absolute path, not shell utilities for the human
# -- hence ~/.claude/scripts rather than dots/shell_scripts (which is on PATH).
- name: find claude agent scripts in repo
  find:
    paths: '{{ devtainer.dir }}/dots/config/claude/scripts'
    patterns: '*'
  register: claude_script_files

- name: copy claude agent scripts
  copy:
    src: '{{ item.path }}'
    dest: '{{ ansible_env.HOME }}/.claude/scripts/{{ item.path | basename }}'
    mode: "{{ '0755' if item.path.endswith('.sh') else '0644' }}"
  loop: '{{ claude_script_files.files }}'
  when: claude_script_files.files | length > 0

- name: copy claude keybindings
  copy:
    src: '{{ devtainer.dir }}/dots/config/claude/keybindings.json'
    dest: '{{ ansible_env.HOME }}/.claude/keybindings.json'
    mode: 0644

- name: ensure claude hooks directory exists
  file:
    path: '{{ ansible_env.HOME }}/.claude/hooks'
    state: directory
    mode: 0755

- name: find claude hook scripts in repo
  find:
    paths: '{{ devtainer.dir }}/dots/config/claude/hooks'
    patterns: '*.sh'
  register: claude_hook_files

- name: copy claude hook scripts
  copy:
    src: '{{ item.path }}'
    dest: '{{ ansible_env.HOME }}/.claude/hooks/{{ item.path | basename }}'
    mode: 0755
  loop: '{{ claude_hook_files.files }}'
  when: claude_hook_files.files | length > 0

# NOTE: the repo owns this file, so anything Claude Code writes into it (theme,
# model, ui permissions) is reverted next run. Use settings.local.json instead.
- name: install claude settings.json
  ansible.builtin.template:
    src: '{{ playbook_dir }}/templates/claude.settings.json.j2'
    dest: '{{ ansible_env.HOME }}/.claude/settings.json'
    mode: 0644
