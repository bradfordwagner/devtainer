---
- name: ensure claude commands directory exists
  file:
    path: '{{ ansible_env.HOME }}/.claude/commands'
    state: directory
    mode: 0755

- name: find claude command files in repo
  find:
    paths: '{{ devtainer.dir }}/dots/config/claude/commands'
    patterns: '*.md'
  register: claude_command_files

- name: copy claude command files
  copy:
    src: '{{ item.path }}'
    dest: '{{ ansible_env.HOME }}/.claude/commands/{{ item.path | basename }}'
    mode: 0644
  loop: '{{ claude_command_files.files }}'
  when: claude_command_files.files | length > 0

- name: copy claude keybindings
  copy:
    src: '{{ devtainer.dir }}/dots/config/claude/keybindings.json'
    dest: '{{ ansible_env.HOME }}/.claude/keybindings.json'
    mode: 0644

- name: ensure claude hooks directory exists
  file:
    path: '{{ ansible_env.HOME }}/.claude/hooks'
    state: directory
    mode: 0755

- name: find claude hook scripts in repo
  find:
    paths: '{{ devtainer.dir }}/dots/config/claude/hooks'
    patterns: '*.sh'
  register: claude_hook_files

- name: copy claude hook scripts
  copy:
    src: '{{ item.path }}'
    dest: '{{ ansible_env.HOME }}/.claude/hooks/{{ item.path | basename }}'
    mode: 0755
  loop: '{{ claude_hook_files.files }}'
  when: claude_hook_files.files | length > 0

# NOTE: this file is now owned by the repo, so anything Claude Code writes into
# it -- a /config theme change, a model switch, permissions added through the
# UI -- is reverted on the next run. Put machine-local or experimental settings
# in ~/.claude/settings.local.json, which is deliberately left unmanaged.
- name: install claude settings.json
  ansible.builtin.template:
    src: '{{ playbook_dir }}/templates/claude.settings.json.j2'
    dest: '{{ ansible_env.HOME }}/.claude/settings.json'
    mode: 0644
