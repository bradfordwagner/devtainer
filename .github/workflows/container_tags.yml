name: container-tags
on:
  push:
    tags:
      - '*'
jobs:
  container:
    uses: bradfordwagner/gh-template-lib/.github/workflows/ansible_playbook.yml@15b233fb2fc6108fa811c065baadf74dfc899788 # 0.3.0
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ github.ref_name }}
